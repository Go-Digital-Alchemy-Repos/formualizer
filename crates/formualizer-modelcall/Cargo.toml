[package]
name = "formualizer-modelcall"
version = "0.1.0"
edition = "2024"
publish = false
description = "Child-model call (MDL.CALLMODEL) calculation path: contract types, routing, memo, ports, prefetch and goal seek (GOD-383)"
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
formualizer-common = { path = "../formualizer-common", features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Lane A: the session evaluates real workbooks through SheetPort.
formualizer-eval = { path = "../formualizer-eval", default-features = false, features = ["system-clock"] }
formualizer-workbook = { path = "../formualizer-workbook", default-features = false, features = ["calamine", "system-clock"] }
formualizer-sheetport = { path = "../formualizer-sheetport", default-features = false, features = ["system-clock"] }
sheetport-spec = { path = "../sheetport-spec" }
sha2 = "0.10"
# Lane B: sibling-plan formula scan (tokenizer).
formualizer-parse = { path = "../formualizer-parse" }
# Architecture B (GOD-383 WP2): native compiled modules (pyo3-free cdylibs).
libloading = "0.8"
